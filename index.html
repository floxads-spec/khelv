
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe Now</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0d16;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: #171b2a;
  border: 1px solid #30374d;
  border-radius: 18px;
}

h1 {
  font-size: 30px;
  margin-bottom: 15px;
}

p {
  color: #b8c0d4;
  line-height: 1.6;
  margin-bottom: 25px;
}

.subscribe-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: #087cff;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.subscribe-btn:hover {
  background: #0064d6;
}
</style>

<!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){
n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window, document,'script',

</noscript>

</head>

<body>

<div class="container">

<h1>Subscribe Now</h1>

<p>Visit our subscription service and continue.</p>

<button class="subscribe-btn" id="subscribeBtn">
SUBSCRIBE
</button>

</div>

<script>
document.getElementById('subscribeBtn')
.addEventListener('click', function() {

  if (typeof fbq === 'function') {
    fbq('trackCustom', 'SubscribeButtonClick');
  }

  alert('Button click recorded for tracking.');

});
</script>

</body>
</html>
