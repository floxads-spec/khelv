<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khelv Game Diwali Celebration</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Poppins, sans-serif;
  background: #100807;
  color: white;
}

.page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 16px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 30%, #722b08, transparent 48%),
    linear-gradient(145deg, #190906, #080505);
}

.glow {
  position: absolute;
  width: 280px;
  height: 280px;
  background: #ff9500;
  filter: blur(120px);
  opacity: .25;
  border-radius: 50%;
}

.card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 480px;
  padding: 38px 23px;
  text-align: center;
  border: 1px solid #b77b28;
  border-radius: 24px;
  background: rgba(48, 17, 7, .9);
  box-shadow: 0 0 45px rgba(255, 153, 0, .18);
}

.badge {
  display: inline-block;
  padding: 8px 20px;
  border: 1px solid #e7ae49;
  border-radius: 30px;
  color: #ffdc87;
  font-size: 12px;
  letter-spacing: 2px;
}

.diya {
  font-size: 82px;
  margin: 23px 0;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {
    filter: drop-shadow(0 0 8px orange);
    transform: scale(1);
  }
  to {
    filter: drop-shadow(0 0 28px gold);
    transform: scale(1.08);
  }
}

h1 {
  font-size: clamp(32px, 8vw, 46px);
  line-height: 1.2;
  font-weight: 900;
  background: linear-gradient(90deg,#ffb52d,#fff1b0,#ffb52d);
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  color: #f5d9b0;
  font-size: 14px;
  line-height: 1.8;
  margin-top: 16px;
}

.offer {
  margin: 30px 0 24px;
  padding: 23px 12px;
  border-radius: 16px;
  border: 1px solid #e8a83d;
  background: linear-gradient(135deg,#69300e,#321306);
}

.offer h2 {
  color: #ffcf70;
  font-size: 21px;
}

.offer p {
  color: #f9dcb0;
  font-size: 13px;
  margin-top: 8px;
}

.register-btn {
  display: block;
  width: 100%;
  padding: 17px 10px;
  margin-top: 25px;
  border: none;
  border-radius: 40px;
  background: linear-gradient(90deg,#ffb52d,#ff6b00);
  color: #351000;
  font-size: 19px;
  font-weight: 900;
  text-decoration: none;
  box-shadow: 0 5px 25px rgba(255,150,0,.3);
  cursor: pointer;
  transition: .3s;
}

.register-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(255,150,0,.5);
}

.footer {
  margin-top: 27px;
  color: #c6a078;
  font-size: 11px;
  letter-spacing: 2px;
}

.sparkle {
  position: absolute;
  color: gold;
  animation: sparkle 2s infinite;
}

.s1 { top: 12%; left: 10%; }
.s2 { top: 25%; right: 10%; }
.s3 { bottom: 15%; left: 13%; }
.s4 { bottom: 20%; right: 12%; }

@keyframes sparkle {
  0%,100% { opacity: .2; transform: scale(.7); }
  50% { opacity: 1; transform: scale(1.4); }
}

@media (max-width: 480px) {
  .card {
    padding: 32px 18px;
  }
}
</style>
</head>

<body>

<main class="page">

<div class="glow"></div>

<span class="sparkle s1">✦</span>
<span class="sparkle s2">✧</span>
<span class="sparkle s3">✦</span>
<span class="sparkle s4">✧</span>

<section class="card">

<div class="badge">FESTIVE CELEBRATION</div>

<div class="diya">🪔</div>

<h1>KHELV GAME<br>DIWALI OFFER</h1>

<p class="subtitle">
Celebrate the festival of lights with joy,
happiness and festive spirit.
</p>

<div class="offer">
<h2>DIWALI SPECIAL CELEBRATION</h2>
<p>Wishing you a bright and joyful Diwali!</p>
</div>

<a href="#" class="register-btn">
Register 500 Bouns
</a>

<div class="footer">
LIGHT • LOVE • HAPPINESS
</div>

</section>
</main>

</body>
</html>
