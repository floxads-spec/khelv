
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Continue to Website</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0d16;
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
  padding: 30px 20px;
}

h1 {
  font-size: 27px;
  margin-bottom: 15px;
}

p {
  color: #aab1c5;
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 28px;
}

.button {
  display: block;
  width: 100%;
  padding: 17px;
  background: #1877f2;
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.button:disabled {
  opacity: 0.6;
}

</style>

<!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function()
{n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];
t=b.createElement(e);t.async=!0;
t.src=v;
s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window, document,'script',

fbq('init', '1464094669037370');
fbq('track', 'PageView');

<noscript>
<img height="1" width="1" style="display:none"

</noscript>

</head>

<body>

<div class="container">

<h1>Welcome</h1>

<p>
Click the button below to continue to the destination website.
</p>

<button class="button" id="continueBtn">
Continue
</button>

</div>

<script>
const button = document.getElementById("continueBtn");

const destination =
"https://www.khelv5.com/#/register?invitationCode=92358104013";

let clicked = false;

button.addEventListener("click", function() {

  if (clicked) return;

  clicked = true;
  button.disabled = true;
  button.textContent = "Please wait...";

  if (typeof fbq === "function") {
    fbq('trackCustom', 'ContinueButtonClick', {}, {
      eventID: 'continue-' + Date.now()
    });
  }

  setTimeout(function() {
    window.location.href = destination;
  }, 1200);

});
</script>

</body>
</html>
