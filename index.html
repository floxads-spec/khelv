
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Pixel Tracking Demo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0d16;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: #171b2a;
  border: 1px solid #30374d;
  border-radius: 18px;
}

h1 {
  font-size: 27px;
  margin-bottom: 12px;
}

p {
  color: #aeb8cc;
  margin-bottom: 25px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #087cff;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0064d6;
}

#status {
  margin-top: 20px;
  font-size: 14px;
  color: #65d99a;
}
</style>

<!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){
n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1464094669037370');
fbq('track', 'PageView');
</script>

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1464094669037370&ev=PageView&noscript=1">
</noscript>
<!-- END META PIXEL -->

</head>

<body>

<div class="container">

  <h1>Meta Pixel Demo</h1>

  <p>
    Click the button below to test the Subscribe event.
  </p>

  <button id="registerBtn" type="button">
    DEMO REGISTER
  </button>

  <div id="status">
    Waiting for button click...
  </div>

</div>

<script>
const registerBtn = document.getElementById('registerBtn');
const status = document.getElementById('status');

registerBtn.addEventListener('click', function() {

  if (typeof fbq === 'function') {

    fbq('track', 'Subscribe');

    status.textContent =
      'Subscribe event sent to Meta Pixel (demo).';

  } else {

    status.textContent =
      'Pixel is not loaded. Please check your connection.';
  }

});
</script>

</body>
</html>
