
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b0d16;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: #171b2a;
  border: 1px solid #30374d;
  border-radius: 18px;
}

h1 {
  font-size: 30px;
  margin-bottom: 15px;
}

p {
  color: #b8c0d4;
  line-height: 1.6;
  margin-bottom: 25px;
}

.subscribe-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: #087cff;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.subscribe-btn:disabled {
  opacity: 0.6;
}
</style>

<!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){
n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)
}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1464094669037370');
fbq('track', 'PageView');
</script>
<!-- END META PIXEL -->

</head>

<body>

<div class="container">

  <h1>Subscribe Now</h1>

  <p>
    Continue to our subscription service.
  </p>

  <button
    type="button"
    class="subscribe-btn"
    id="subscribeButton">
    SUBSCRIBE
  </button>

</div>

<script>
const button = document.getElementById('subscribeButton');

button.addEventListener('click', function () {

  if (button.disabled) return;

  button.disabled = true;

  if (typeof fbq === 'function') {
    fbq('trackCustom', 'SubscribeButtonClick');
  }

  button.disabled = false;

});
</script>

</body>
</html>
