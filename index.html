
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b0d16;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: #171b2a;
  border: 1px solid #30374d;
  border-radius: 18px;
}

h1 {
  font-size: 30px;
  margin-bottom: 15px;
}

p {
  color: #b8c0d4;
  line-height: 1.6;
  margin-bottom: 25px;
}

.subscribe-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: #087cff;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.subscribe-btn:hover {
  background: #0064d6;
}
</style>
</head>

<body>

<div class="container">
  <h1>Subscribe Now</h1>
  <p>Click below to continue to our subscription service.</p>

  <a href="#" class="subscribe-btn">
    SUBSCRIBE
  </a>
</div>

</body>
</html>
